[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent"
version = "0.1.0"
description = "秋招投递智能体的模块化单体工程骨架"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic[email]>=2.7,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    # 固定已在 Python 3.11 与当前 AppTest 契约验证的次版本，避免 UI 行为漂移。
    "streamlit>=1.39,<1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
job-agent = "job_agent.app.main:main"

[tool.setuptools.packages.find]
include = ["job_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
