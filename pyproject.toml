[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent"
version = "0.1.0"
description = "秋招投递智能体的模块化单体工程骨架"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
job-agent = "job_agent.app.main:main"

[tool.setuptools.packages.find]
include = ["job_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

